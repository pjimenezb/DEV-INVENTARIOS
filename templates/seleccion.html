<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Marbetes - Selección</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at center, #1c2331 0%, #0d1117 100%);
        }
        .seleccion-card {
            background: rgba(22, 27, 34, 0.9);
            border: 1px solid var(--border-color, #30363d);
            border-radius: 16px;
            padding: 48px;
            max-width: 820px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .modo-btn {
            border: 2px solid var(--border-color, #30363d);
            border-radius: 14px;
            padding: 32px 24px;
            background: transparent;
            transition: all 0.2s ease;
            height: 100%;
            color: inherit;
        }
        .modo-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.4);
            background: rgba(255,255,255,0.03);
        }
        .modo-btn .icono {
            font-size: 3rem;
            line-height: 1;
        }
        .modo-btn h3 {
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .badge-modo {
            font-size: 0.75rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="seleccion-card">
        <div class="text-center mb-4">
            <h1 class="display-6 fw-bold mb-1">Sistema de Marbetes</h1>
            <p class="text-muted mb-0">Selecciona el tipo de inventario a trabajar</p>
        </div>
        <div class="row g-4">
            <div class="col-md-6">
                <button type="button" class="modo-btn w-100 text-start" onclick="selectMode('mp')">
                    <div class="d-flex align-items-center gap-3 mb-2">
                        <span class="icono">🏭</span>
                        <div>
                            <h3 class="mb-0 text-warning">Inventario MP</h3>
                            <span class="badge badge-modo bg-warning text-dark mt-1">Materia Prima</span>
                        </div>
                    </div>
                    <p class="text-muted small mb-0 mt-3">
                        Todo el flujo de Materia Prima: Ejecuciones, Pool Final, Matriz,
                        Cargas WMS, Saldos, Etiquetas, EPTS, Análisis Final y Auditoría.
                    </p>
                </button>
            </div>
            <div class="col-md-6">
                <button type="button" class="modo-btn w-100 text-start" onclick="selectMode('pt')">
                    <div class="d-flex align-items-center gap-3 mb-2">
                        <span class="icono">📦</span>
                        <div>
                            <h3 class="mb-0 text-info">Inventario PT</h3>
                            <span class="badge badge-modo bg-info text-dark mt-1">Producto Terminado</span>
                        </div>
                    </div>
                    <p class="text-muted small mb-0 mt-3">
                        Extracción de existencias de Producto Terminado: CEDIS 1-4 (Odoo),
                        NAVE 6 (Odoo) y WMS 1-4 (bases de datos separadas).
                    </p>
                </button>
            </div>
        </div>
    </div>

    <script>
        function selectMode(mode) {
            localStorage.setItem('modo_inventario', mode);
            if (mode === 'mp') {
                window.location.href = '/inventario_mp';
            } else {
                window.location.href = '/inventario_pt';
            }
        }
    </script>
</body>
</html>
